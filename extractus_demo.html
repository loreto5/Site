<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extractus Web - Demonstração de Integração</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }
    .form-container {
      background-color: #ffffff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .progress-container {
      margin-top: 20px;
    }
    .toggle-checkbox {
      display: none;
    }
    .toggle-label {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 20px;
      background-color: #ccc;
      border-radius: 9999px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .toggle-label::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background-color: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle-checkbox:checked + .toggle-label {
      background-color: #0052CC;
    }
    .toggle-checkbox:checked + .toggle-label::after {
      transform: translateX(20px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4">Extractus Web - Demonstração de Integração</h1>
    <p class="lead">Esta página demonstra como integrar o frontend com os scripts Python de extração de documentos.</p>
    
    <div class="form-container">
      <h2 class="mb-3">Formulário de Extração</h2>
      <form id="extractusForm">
        <div class="mb-3">
          <label for="excel_file" class="form-label">Arquivo Excel:</label>
          <input class="form-control" type="file" accept=".xlsx,.xls" id="excel_file" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Data de Vencimento:</label>
          <select class="form-select" id="vencimento" required>
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="20" selected>20</option>
            <option value="25">25</option>
            <option value="30">30</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Mês de Referência:</label>
          <select class="form-select" id="mes" required>
            <option value="01">01 - Jan</option>
            <option value="02">02 - Fev</option>
            <option value="03">03 - Mar</option>
            <option value="04" selected>04 - Abr</option>
            <option value="05">05 - Mai</option>
            <option value="06">06 - Jun</option>
            <option value="07">07 - Jul</option>
            <option value="08">08 - Ago</option>
            <option value="09">09 - Set</option>
            <option value="10">10 - Out</option>
            <option value="11">11 - Nov</option>
            <option value="12">12 - Dez</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Tipos de Documento:</label>
          <div class="d-flex flex-wrap gap-4 mt-2">
            <div class="d-flex align-items-center gap-2">
              <input type="checkbox" id="boleto" value="boleto" class="toggle-checkbox" checked>
              <label for="boleto" class="toggle-label"></label>
              <span>Boletos</span>
            </div>
            <div class="d-flex align-items-center gap-2">
              <input type="checkbox" id="nota" value="nota" class="toggle-checkbox">
              <label for="nota" class="toggle-label"></label>
              <span>Notas Fiscais</span>
            </div>
            <div class="d-flex align-items-center gap-2">
              <input type="checkbox" id="relatorio" value="relatorio" class="toggle-checkbox">
              <label for="relatorio" class="toggle-label"></label>
              <span>Relatórios</span>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100" style="background-color: #0052CC; border-color: #0052CC;">
          Iniciar Extração
        </button>
      </form>
    </div>

    <div id="statusContainer" class="progress-container" style="display: none;">
      <h3>Status da Extração:</h3>
      
      <div class="progress mb-3">
        <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 100%; background-color: #0052CC !important;"></div>
      </div>
      
      <div id="progressContainer" class="space-y-4">
        <!-- Progresso dos tipos de documento será inserido aqui -->
      </div>
      
      <div id="statusText" class="mt-2">Processando...</div>
      
      <div id="resultButtons" class="mt-3 d-flex flex-column gap-3" style="display: none;">
        <div id="downloadLinks" class="d-flex flex-column gap-2">
          <!-- Links de download serão inseridos aqui -->
        </div>
        <button id="resetButton" class="btn btn-outline-secondary">
          <i class="fas fa-redo me-2"></i>
          Nova Extração
        </button>
      </div>
    </div>
  </div>

  <!-- Incluir o arquivo de API simulada -->
  <script src="extractus_api.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('extractusForm');
      const statusContainer = document.getElementById('statusContainer');
      const progressContainer = document.getElementById('progressContainer');
      const statusText = document.getElementById('statusText');
      const resultButtons = document.getElementById('resultButtons');
      const resetButton = document.getElementById('resetButton');
      
      // Estado da aplicação
      let processando = {
        boleto: false,
        nota: false,
        relatorio: false
      };
      
      let progresso = {
        boleto: 0,
        nota: 0,
        relatorio: 0
      };
      
      let resultados = {
        boleto: 0,
        nota: 0,
        relatorio: 0
      };
      
      // Função para atualizar a interface com o progresso
      function atualizarProgresso() {
        progressContainer.innerHTML = '';
        
        const tiposAtivos = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'))
          .map(checkbox => checkbox.value);
        
        tiposAtivos.forEach(tipo => {
          const div = document.createElement('div');
          div.className = 'mb-3';
          
          const headerDiv = document.createElement('div');
          headerDiv.className = 'd-flex justify-content-between mb-1';
          
          const label = document.createElement('span');
          label.className = 'fw-medium';
          label.textContent = tipo === 'boleto' ? 'Boletos' : 
                             tipo === 'nota' ? 'Notas Fiscais' : 'Relatórios';
          
          const status = document.createElement('span');
          status.className = 'fw-medium';
          status.innerHTML = `${progresso[tipo]}%`;
          
          if (processando[tipo]) {
            status.innerHTML += ' <i class="fas fa-spinner fa-spin ms-2"></i>';
          } else if (progresso[tipo] === 100) {
            status.innerHTML += ` <span class="text-success ms-2">${resultados[tipo]} documentos</span>`;
          }
          
          headerDiv.appendChild(label);
          headerDiv.appendChild(status);
          
          const progressBarContainer = document.createElement('div');
          progressBarContainer.className = 'progress';
          progressBarContainer.style.height = '10px';
          
          const progressBar = document.createElement('div');
          progressBar.className = 'progress-bar';
          progressBar.style.width = `${progresso[tipo]}%`;
          progressBar.style.backgroundColor = tipo === 'boleto' ? '#0d6efd' : 
                                             tipo === 'nota' ? '#198754' : '#6f42c1';
          
          progressBarContainer.appendChild(progressBar);
          
          div.appendChild(headerDiv);
          div.appendChild(progressBarContainer);
          
          progressContainer.appendChild(div);
        });
      }
      
      // Função para iniciar o processamento de um tipo de documento
      function processarTipo(tipo, extractionId) {
        processando[tipo] = true;
        progresso[tipo] = 0;
        atualizarProgresso();
        
        // Criar um EventSource para acompanhar o progresso
        const eventSource = criarEventSource(tipo);
        eventSource.onmessage = function(event) {
          const data = JSON.parse(event.data);
          
          if (data.progresso) {
            progresso[tipo] = data.progresso.porcentagem;
            
            if (data.progresso.porcentagem >= 100) {
              processando[tipo] = false;
            }
            
            atualizarProgresso();
          }
          
          if (data.resultados) {
            resultados[tipo] = data.resultados[tipo];
            atualizarProgresso();
            
            // Verificar se todos os tipos foram processados
            const tiposAtivos = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'))
              .map(checkbox => checkbox.value);
            
            const todosProcessados = tiposAtivos.every(t => !processando[t]);
            
            if (todosProcessados) {
              statusText.textContent = 'Concluído';
              resultButtons.style.display = 'flex';
            }
          }
        };
        
        // Conectar ao EventSource real com o ID da extração
        if (extractionId) {
          eventSource.connect(extractionId);
        } else {
          // Fallback para simulação se não tiver ID (não deve acontecer em produção)
          console.warn('Sem extractionId, usando simulação de progresso');
          eventSource.simulateProgress();
        }
        
        // Limpar recursos quando a página for fechada
        window.addEventListener('beforeunload', function() {
          eventSource.close();
        });
      }
      
      // Função para exibir os links de download
      function exibirLinksDeDownload(arquivos) {
        const downloadLinks = document.getElementById('downloadLinks');
        downloadLinks.innerHTML = '';

        arquivos.forEach(arquivo => {
          const link = document.createElement('a');
          link.href = arquivo.caminho;
          link.textContent = `Baixar ${arquivo.nome}`;
          link.className = 'btn btn-primary';
          link.style.backgroundColor = '#0052CC';
          link.style.borderColor = '#0052CC';
          link.download = arquivo.nome;
          downloadLinks.appendChild(link);
        });
      }

      // Manipulador de envio do formulário
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const fileInput = document.getElementById('excel_file');
        const vencimento = document.getElementById('vencimento').value;
        const mes = document.getElementById('mes').value;
        
        const tiposAtivos = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'))
          .map(checkbox => checkbox.value);
        
        if (!fileInput.files[0]) {
          alert('Selecione um arquivo Excel.');
          return;
        }
        
        if (tiposAtivos.length === 0) {
          alert('Selecione pelo menos um tipo de documento.');
          return;
        }
        
        // Mostrar o container de status
        statusContainer.style.display = 'block';
        resultButtons.style.display = 'none';
        statusText.textContent = 'Processando...';
        
        // Resetar o estado
        processando = {
          boleto: false,
          nota: false,
          relatorio: false
        };
        
        progresso = {
          boleto: 0,
          nota: 0,
          relatorio: 0
        };
        
        resultados = {
          boleto: 0,
          nota: 0,
          relatorio: 0
        };
        
        // Atualizar a interface
        atualizarProgresso();
        
        // Simular o envio do arquivo para o servidor
        console.log('Enviando arquivo para o servidor...');
        
        // Parâmetros para a extração
        const params = {
          excelPath: fileInput.files[0], // Passar o objeto File diretamente
          saveDir: '/downloads',
          dueDay: vencimento,
          monthNumber: mes,
          tipos: tiposAtivos
        };
        
        // Executar a extração
        executarExtracao(params)
          .then(data => {
            console.log('Extração iniciada:', data);

            // Exibir links de download ao concluir
            if (data.arquivos_gerados) {
              exibirLinksDeDownload(data.arquivos_gerados);
            }
            
            // Armazenar o ID da extração
            const extractionId = data.extractionId;
            
            // Iniciar o processamento de cada tipo
            tiposAtivos.forEach(tipo => {
              processarTipo(tipo, extractionId);
            });
          })
          .catch(error => {
            console.error('Erro na extração:', error);
            statusText.textContent = `Erro: ${error.message}`;
          });
      });
      
      // Manipulador do botão de reset
      resetButton.addEventListener('click', function() {
        statusContainer.style.display = 'none';
        form.reset();
        
        // Marcar o checkbox de boletos como padrão
        document.getElementById('boleto').checked = true;
      });
    });
  </script>
</body>
</html>
